version: '3.8'

services:
  call-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: lik28-call-analyzer:latest
    container_name: lik28-call-analyzer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Moscow
      - PORT=3000
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - STORE_ENCRYPTION_KEY=${STORE_ENCRYPTION_KEY}
      - DATA_PATH=/app/data/data-store.json
      - DATA_PATH_ENC=/app/data/data-store.enc
      - CONSENT_PATH=/app/data/consents.enc
      - CONSENTS_PATH=/app/data/consents.enc
      # Yandex Cloud (SpeechKit & IAM)
      - YC_FOLDER_ID=${YC_FOLDER_ID}
      - YC_API_KEY=${YC_API_KEY}
      - YC_SERVICE_ACCOUNT_KEY_FILE=/app/keys/authorized_key.json
      # Yandex Object Storage (SpeechKit long audio)
      - YC_STORAGE_BUCKET=${YC_STORAGE_BUCKET}
      - YC_STORAGE_ACCESS_KEY=${YC_STORAGE_ACCESS_KEY}
      - YC_STORAGE_SECRET_KEY=${YC_STORAGE_SECRET_KEY}
      - YC_STORAGE_ENDPOINT=${YC_STORAGE_ENDPOINT:-https://storage.yandexcloud.net}
      - YC_STORAGE_REGION=${YC_STORAGE_REGION:-ru-central1}
      # S3 Timeweb Cloud (Encrypted 152-FZ backup sync)
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3.timeweb.cloud}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-lik28/data/}
      - S3_REGION=${S3_REGION:-ru-1}
      - S3_SYNC_INTERVAL_SEC=${S3_SYNC_INTERVAL_SEC:-300}
      # Sber GigaChat
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat:Lite}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      # Мегафон ВАТС
      - MEGAFON_TOKEN=${MEGAFON_TOKEN}
      # ВКонтакте (оповещения)
      - VK_TOKEN=${VK_TOKEN}
      - VK_CHAT_ID=${VK_CHAT_ID}
      # YClients
      - YCLIENTS_USER_TOKEN=${YCLIENTS_USER_TOKEN}
      - YCLIENTS_PARTNER_TOKEN=${YCLIENTS_PARTNER_TOKEN}
      - YCLIENTS_SALON_ID=${YCLIENTS_SALON_ID}
      # 152-ФЗ Регламентные сроки хранения логов и временных файлов
      - TTL_LOG_DAYS=${TTL_LOG_DAYS:-30}
      - TTL_TEMP_DAYS=${TTL_TEMP_DAYS:-30}
      - TTL_AUDIO_DAYS=${TTL_AUDIO_DAYS:-30}
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys:ro
      - ./temp:/app/temp
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
