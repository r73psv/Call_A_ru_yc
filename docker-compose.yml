version: '3.8'

services:
  call-analyzer:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Moscow
      - STORE_ENCRYPTION_KEY=${STORE_ENCRYPTION_KEY}
      - YC_SERVICE_ACCOUNT_KEY_FILE=/app/keys/authorized_key.json
      - YC_STORAGE_BUCKET=${YC_STORAGE_BUCKET}
      - YC_S3_KEY_ID=${YC_S3_KEY_ID}
      - YC_S3_SECRET_KEY=${YC_S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3.timeweb.cloud}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-lik28/}
      - S3_SYNC_INTERVAL_SEC=${S3_SYNC_INTERVAL_SEC:-300}
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat:Lite}
      - MEGAFON_TOKEN=${MEGAFON_TOKEN}
      - VK_TOKEN=${VK_TOKEN}
      - VK_CHAT_ID=${VK_CHAT_ID}
      - YCLIENTS_USER_TOKEN=${YCLIENTS_USER_TOKEN}
      - YCLIENTS_PARTNER_TOKEN=${YCLIENTS_PARTNER_TOKEN}
      - YCLIENTS_SALON_ID=${YCLIENTS_SALON_ID}
    volumes:
      - ./data:/app/data
      - ./keys/authorized_key.json:/app/keys/authorized_key.json:ro
